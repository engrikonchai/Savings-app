<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CarGoal - Loading...</title>
    <script>
      // Handle GitHub Pages 404 redirects for client-side routing
      // This is served when a route like /Savings-app/onboarding is accessed
      const fullPath = window.location.pathname;
      const basePath = '/Savings-app';

      // Extract the app path (everything after /Savings-app)
      let appPath = '/';
      if (fullPath.startsWith(basePath + '/')) {
        appPath = fullPath.slice(basePath.length);
      } else if (fullPath === basePath) {
        appPath = '/';
      }

      // Store the path for index.html to use
      sessionStorage.redirectPath = appPath;

      // Redirect to index.html (which will use the stored path)
      window.location.replace('/Savings-app/');
    </script>
  </head>
  <body>
    <p>Loading CarGoal...</p>
  </body>
</html>
